name: Build Windows plugin

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build native VLC module
        run: |
          cargo build --release --locked
          cargo test --lib --locked --no-default-features

      - name: Check release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'vlc-youtube-bridge').version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$version") {
              throw "Release tag must match the Cargo version v$version."
          }

      - name: Stage plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Path target/release/libyoutube_bridge_plugin.dll, target/release/install-bridge.exe, README.md, LICENSE -Destination package

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: vlc-youtube-bridge-windows-x64
          path: package/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vlc-youtube-bridge-windows-x64
          path: package

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $zip = "vlc-youtube-bridge-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path package/* -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
          gh release create $env:RELEASE_TAG $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "YouTube Bridge $env:RELEASE_TAG" --notes "Extract the Windows x64 ZIP and run install-bridge.exe alongside the DLL. See the README in the ZIP for prerequisites and troubleshooting."
