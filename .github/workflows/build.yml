name: Build Windows plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build native VLC module
        run: |
          cargo build --release --locked
          cargo test --lib --locked --no-default-features

      - name: Stage plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Path target/release/libyoutube_bridge_plugin.dll, target/release/install-bridge.exe, README.md, LICENSE -Destination package

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: vlc-youtube-bridge-windows-x64
          path: package/
          if-no-files-found: error
